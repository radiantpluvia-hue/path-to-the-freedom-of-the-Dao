name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Merge equipment and validate data
        run: |
          node scripts/merge_equipment.js
          if npm run | grep -q "validate:data"; then
            npm run validate:data
          else
            node scripts/validateData.js || true
          fi
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (optional; requires ESLint devDependencies)
        run: npm run lint || true
      - name: Run tests
        run: npx jest --config=jest.config.cjs --runInBand --verbose
